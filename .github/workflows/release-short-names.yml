# Copies the cargo-dist installer and Windows archive to the short names the
# README links to. This stays outside release.yml: that file is generated, and
# `dist plan` fails when its contents drift.
#
# workflow_run only fires when the Release run was not authored by the default
# GITHUB_TOKEN. release-on-bump.yml dispatches with RELEASE_DISPATCH_TOKEN when
# that secret is set, which is the path that reaches this job.

name: Release short download names

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach short names to. Empty uses the latest release.
        required: false
        type: string

permissions:
  contents: write

jobs:
  aliases:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Upload short download names
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "Attaching short names to ${tag}"
          tmp=$(mktemp -d)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$tmp" \
            --pattern 'openresearch-cli-installer.sh' \
            --pattern 'openresearch-cli-installer.ps1' \
            --pattern 'openresearch-cli-x86_64-pc-windows-msvc.zip'
          cp "$tmp/openresearch-cli-installer.sh" "$tmp/install.sh"
          cp "$tmp/openresearch-cli-installer.ps1" "$tmp/install.ps1"
          cp "$tmp/openresearch-cli-x86_64-pc-windows-msvc.zip" "$tmp/windows.zip"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "$tmp/install.sh" "$tmp/install.ps1" "$tmp/windows.zip"
